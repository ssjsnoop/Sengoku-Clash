<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sengoku Clash</title>
<style>
  html,body{margin:0;height:100%;background:#120d16;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:relative;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc((100dvh - 92px)*16/9));aspect-ratio:16/9}
  canvas#game{width:100%;height:100%;display:block;image-rendering:pixelated;background:#000;touch-action:none}
  #cards{display:flex;gap:5px;padding:6px;justify-content:center;height:84px;box-sizing:border-box;width:100%}
  .card{position:relative;width:76px;height:72px;background:#2a2234;border:2px solid #5a4a6a;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer;overflow:hidden;flex:0 1 76px;min-width:0}
  .card canvas{width:68px;height:39px;image-rendering:pixelated}
  .card .nm{font-weight:700;font-size:10px;white-space:nowrap}
  .card .cost{color:#ffd86b;font-weight:700}
  .card .key{position:absolute;top:1px;left:4px;color:#9a8aaa;font-size:10px}
  .card .cd{position:absolute;left:0;bottom:0;width:100%;height:0;background:rgba(0,0,0,.6);pointer-events:none}
  .card.off{opacity:.5}
  .card.locked{opacity:.4;filter:grayscale(1)}
  .card.special{border-color:#c9a24a}
  .card.order{flex:0 1 54px;width:54px;border-color:#4f7aa8}
  .card.order.act{background:#2f4f86;border-color:#fff}
  .card.order .ico{font-size:20px}
  #touch{position:absolute;inset:0;pointer-events:none;display:none}
  .tb{position:absolute;pointer-events:auto;width:60px;height:60px;border-radius:50%;background:rgba(20,14,28,.55);border:2px solid rgba(255,255,255,.35);color:#fff;font-size:21px;display:flex;align-items:center;justify-content:center;touch-action:none}
  .tb.sm{width:42px;height:42px;font-size:14px;border-radius:10px}
  .tb:active{background:rgba(255,200,80,.5)}
  #overlay{position:absolute;inset:0;background:rgba(10,6,16,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;box-sizing:border-box;z-index:5;overflow:auto}
  #overlay.clear{background:rgba(10,6,16,.5)}
  #overlay h1{margin:0 0 4px;font-size:clamp(26px,6vw,58px);letter-spacing:4px;color:#ffd86b;text-shadow:0 4px 0 #7a2a2a}
  #overlay h2{margin:0 0 4px;font-size:clamp(16px,2.6vw,26px);color:#ffd86b}
  #overlay p{margin:4px 0;max-width:760px;font-size:clamp(11px,1.6vw,15px);line-height:1.4;color:#ddd}
  #overlay .keys{color:#aaa;font-size:clamp(10px,1.4vw,13px)}
  .btns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
  .btn{background:#b02a2a;border:2px solid #ffd86b;color:#fff;font-weight:800;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:clamp(12px,1.8vw,15px)}
  .btn:hover{background:#d03a3a}
  .btn.alt{background:#2f4f86}
  .btn.sel{outline:3px solid #fff}
  .btn.small{padding:5px 12px;font-size:12px}
  .btn.dim{background:#3a3344;border-color:#6a5a7a;color:#bbb}
  .btn.off{opacity:.45;cursor:not-allowed}
  .start{font-size:clamp(18px,3.4vw,32px);letter-spacing:5px;font-weight:900;color:#fff;margin-top:18px;cursor:pointer;animation:blink 1.2s infinite;text-shadow:0 2px 0 #000}
  @keyframes blink{50%{opacity:.3}}
  .sub{color:#e8c8a0;letter-spacing:3px;font-size:clamp(11px,1.8vw,16px);margin-bottom:4px}
  .mapwrap{width:min(94%,860px)}
  .mapwrap svg{width:100%;height:auto;display:block;border:3px solid #6a4a2a;border-radius:10px;background:#e2cf9b}
  .brief{margin-top:6px;font-size:clamp(11px,1.6vw,14px);line-height:1.35;color:#eee}
  .brief b{color:#ffd86b}
  .vet{font-size:11px;color:#cbb36a;margin-top:2px}
  .nd{cursor:pointer}
  .pulse{animation:pulse 1.1s infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{50%{transform:scale(1.18)}}
  .help{max-width:640px;width:92%;background:rgba(30,22,40,.9);border:2px solid #6a4a8a;border-radius:12px;padding:12px 16px;text-align:left}
  .help h3{margin:0 0 6px;color:#ffd86b;font-size:clamp(15px,2.4vw,22px)}
  .help li,.help div.t{font-size:clamp(11px,1.6vw,15px);line-height:1.45;margin:3px 0;color:#eee}
  .help ul{margin:4px 0;padding-left:20px}
  .help kbd{background:#3a3050;border:1px solid #7a6a9a;border-radius:4px;padding:0 5px;font-size:.9em}
  .dots{margin-top:8px;color:#8a7aaa;letter-spacing:5px}
  .shop{width:min(94%,640px);text-align:left}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(40,30,56,.85);border:1px solid #6a4a8a;border-radius:8px;padding:6px 10px;margin:5px 0;font-size:clamp(11px,1.6vw,14px)}
  .row b{color:#ffd86b}
  .row small{color:#b8a8d0;display:block}

  .tb[data-act=left]{left:12px;bottom:12px}
  .tb[data-act=right]{left:80px;bottom:12px}
  .tb[data-act=up]{left:12px;bottom:78px}
  .tb[data-act=down]{left:80px;bottom:78px}
  .tb[data-act=atk]{right:12px;bottom:12px}
  .tb[data-act=block]{right:80px;bottom:12px}
  .tb[data-act=dodge]{right:46px;bottom:78px}
  .tb[data-act=special]{right:114px;bottom:78px}
  .tb[data-act=prev]{right:112px;top:56px}
  .tb[data-act=next]{right:60px;top:56px}
  .tb[data-act=gen]{right:8px;top:56px}
  .tb[data-act=peek]{right:164px;top:56px}
  .tb[data-act=pause]{left:8px;top:140px}
  #rot{display:none;position:fixed;top:0;left:0;right:0;background:#b02a2a;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:6px;z-index:20;pointer-events:none}
  @media (orientation:portrait) and (pointer:coarse){#rot{display:block}}
  @media (max-height:520px),(max-width:760px){
    #cards{height:58px;padding:3px;gap:3px}
    .card{height:50px;flex:1 1 0;max-width:56px;min-width:0;border-width:1px;border-radius:6px;width:auto}
    .card canvas{width:40px;height:23px}
    .card .nm{display:none}
    .card .key{font-size:9px;left:3px}
    .card .cost{font-size:10px}
    .card div[style*="font-size"]{font-size:16px!important}
    .card.order .ico{font-size:15px}
  }
  @media (max-height:520px){
    #stage{width:min(100vw,calc((100dvh - 62px)*16/9))}
    .tb{width:50px;height:50px;font-size:18px}
    .tb.sm{width:38px;height:38px;font-size:13px}
    .tb[data-act=left]{left:8px;bottom:8px}
    .tb[data-act=right]{left:62px;bottom:8px}
    .tb[data-act=up]{left:8px;bottom:62px}
    .tb[data-act=down]{left:62px;bottom:62px}
    .tb[data-act=atk]{right:8px;bottom:8px}
    .tb[data-act=block]{right:62px;bottom:8px}
    .tb[data-act=dodge]{right:35px;bottom:62px}
    .tb[data-act=special]{right:89px;bottom:62px}
    .tb[data-act=gen]{right:6px;top:50px}
    .tb[data-act=next]{right:48px;top:50px}
    .tb[data-act=prev]{right:90px;top:50px}
    .tb[data-act=peek]{right:132px;top:50px}
  }
</style>
</head>
<body>
<div id="rot">📱 Turn your phone sideways for the best view</div>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="touch">
      <div class="tb" data-act="left">◀</div>
      <div class="tb" data-act="right">▶</div>
      <div class="tb" data-act="up">▲</div>
      <div class="tb" data-act="down">▼</div>
      <div class="tb" data-act="atk">⚔</div>
      <div class="tb" data-act="block">🛡</div>
      <div class="tb" data-act="dodge">💨</div>
      <div class="tb" data-act="special">✦</div>
      <div class="tb sm" data-act="prev">Q</div>
      <div class="tb sm" data-act="next">E</div>
      <div class="tb sm" data-act="gen">G</div>
      <div class="tb sm" data-act="peek">👁</div>
      <div class="tb sm" data-act="pause">❚❚</div>
    </div>
    <div id="overlay"></div>
  </div>
  <div id="cards"></div>
</div>

const PENT = [0, 3, 5, 7, 10];

      if (m !== 'calm' && Math.random() < 0.3) idx = (idx + 1 + (Math.random() * 2 | 0)) % 5;
      const semi = PENT[idx % 5] + (m === 'boss' ? 0 : 0);
      const f = root * 2 * Math.pow(2, semi / 12) * (st % 32 >= 16 ? 1.5 : 1);
      tone(f, t, spb * 1.8, 'triangle', m === 'calm' ? 0.035 : 0.045);

function makeLayer(f, color, base, amp, seed, peaky, trees) {

  for (let i = 0; i <= w; i += 6) {

    x.fillStyle = color;
    for (let i = 0; i < w; i += 18 + rnd() * 40) {

      x.beginPath(); x.moveTo(i, ty); x.lineTo(i + 9, ty - th); x.lineTo(i + 18, ty); x.fill();
      x.beginPath(); x.moveTo(i + 2, ty - th * 0.4); x.lineTo(i + 9, ty - th * 1.15); x.lineTo(i + 16, ty - th * 0.4); x.fill();

}

// ------------------------------------------------------------------ update
function update(dt) {
  G.t += dt;

    let inc = PLAYER_INC + 4 * G.rice, einc = G.stage.inc * G.diff.inc;

    if (G.warCd > 0) G.warCd -= dt;
    if (G.buff > 0) G.buff -= dt;
    enemySpawnAI(dt);
    updateOutposts(dt);
    for (const g of G.gen) if (g.dead && g.type !== 'emperor') { g.respT -= dt; if (g.respT <= 0) revive(g); }
    if (G.stage.hazardFire) {
      G.hazT -= dt;
      if (G.hazT <= 0) {
        G.hazT = rand(4, 7);
        if (G.zones.filter(z => z.kind === 'fire' && z.hurt === -1).length < 4) {
          const mid = G.ctrl ? G.ctrl.x : WW / 2;
          G.zones.push({ kind: 'fire', x: clamp(mid + rand(-700, 700), 500, WW - 500), ly: rand(-20, 35), r: 85, t: 0, life: 9, hurt: -1, tick: 0.5, owner: null, lw: 40 });
        }

    }
    updateHints(dt);
  } else {
    G.overT += dt;
  }
  for (const u of G.units) updateUnit(u, dt);
  updateZones(dt);
  // castle turrets
  for (const c of G.castle) {
    if (c.dead) { c.deadT += dt; if (Math.random() < 0.3) spark(c.x + rand(-100, 100), GY - rand(0, 40), '#ff9a3a'); continue; }
    if (c.flash > 0) c.flash -= dt;
    if (G.over) continue;
    c.fireT -= dt;
    if (c.fireT <= 0) {
      let best = null, bd = 440;
      for (const e of G.units) { if (e.dead || e.team === c.team) continue; const d = Math.abs(e.x - c.x); if (d < bd) { bd = d; best = e; } }
      if (best) {
        const dir = best.x >= c.x ? 1 : -1;
        const dm = (5 + 2.2 * G.stageIdx) * (c.team ? G.diff.dmg * (G.stage.boss ? 1.5 : 1) : 1);

    for (let j = i + 1; j < live.length; j++) {
      const b = live[j];
      if (b.team !== a.team || b.state === 'attack' || b.state === 'dash' || isGen(b)) continue;
      const d = a.x - b.x;
      if (Math.abs(d) < 14 && Math.abs(a.ly - b.ly) < 10) {
        const p = (14 - Math.abs(d)) * dt * 6 * (d >= 0 ? 1 : -1);
        if (!a.ctrl) a.x += p;
        if (!b.ctrl) b.x -= p;
      }
    }
  }
  for (const a of G.arrows) {
    a.x += a.vx * dt; a.life -= dt;
    let done = false;
    for (const e of G.units) {
      if (e.dead || e.team === a.team) continue;
      if (Math.abs(e.x - a.x) < 14 && Math.abs(e.ly - a.ly) <= 24) {
        hit(a.owner, e, a.dmg, Math.sign(a.vx) * 100, a.x - Math.sign(a.vx) * 30, false);
        if (a.owner && a.owner.ctrl && !e.dead) { gainXP(a.owner, 3); }

  G.texts = G.texts.filter(t => t.t < t.life);

  let tx;

    tx = clamp(G.camT, 0, WW - VW);
  } else {
    const focus = G.over ? G.focusX : f.x + f.face * 90;
    tx = clamp(focus - VW / 2, 0, WW - VW);
  }
  G.cam += (tx - G.cam) * Math.min(1, dt * (G.over ? 3 : 5));
  const zt = G.over ? 1.28 : 1;
  G.zoom += (zt - G.zoom) * Math.min(1, dt * 3);
  if (G.over && G.overT > 1.3 && G.state === 'play') endBattle();
}

function updateOutposts(dt) {

    let a = 0, b = 0;
    for (const u of G.units) { if (u.dead || isGen(u) || Math.abs(u.x - o.x) > 170) continue; if (u.team === 0) a++; else b++; }
    if (a > 0 && b === 0) o.prog = Math.min(1, o.prog + dt * 0.18 * Math.min(4, a));

    else if (o.prog <= -0.999 && o.owner !== 1) { o.owner = 1; floatText(o.x, GY - 130, 'Flag lost', '#ff8a8a', 1.4); }
  }

    }

      const side = o ? o.team : 1;
      const col = z.kind === 'frost' ? '150,220,255' : z.kind === 'rock' ? '200,170,120' : '255,220,160';
      const mult = z.kind === 'slam' ? 1.3 : z.kind === 'rock' ? 1.1 : 0.7;
      for (const e of G.units) {
        if (e.dead || e.team === side) continue;
        if (Math.abs(e.x - z.x) < z.r && Math.abs(e.ly - z.ly) < z.lw) {
          const dmg = (o ? dmgOf(o) : 20) * mult;
          if (hit(o || { x: z.x, team: side }, e, dmg, (e.x >= z.x ? 1 : -1) * 260, z.x, false) && z.kind === 'frost' && !e.dead) { e.slowT = 3; floatText(e.x, GY + e.ly - 110, 'FROZEN', '#bde', 0.8); }
        }
      }
      G.fx.push({ x: z.x, y: GY + z.ly - 6, ring: z.r, t: 0, life: 0.35, col });
      G.shake = Math.max(G.shake, z.kind === 'rock' ? 5 : 10);
      sfx(70, 0.35, 'sawtooth', 0.08, -30);
      for (let i = 0; i < 16; i++) spark(z.x + rand(-z.r, z.r), GY + z.ly - 10, '#e8c080');
    }
  }
  G.zones = G.zones.filter(z => !z.done);
}

function nearestEnemy(u, maxD) {
  let best = null, bd = maxD;
  for (const e of G.units) {
    if (e.dead || e.team === u.team) continue;
    const d = Math.abs(e.x - u.x);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function applyTerrain(u, dt) {
  let lo = laneMin(), hi = laneMax();
  if (G.stage.river && Math.abs(u.x - WW / 2) < 175) { lo = Math.max(lo, -10); hi = Math.min(hi, 16); }
  if (u.ly < lo) u.ly = Math.min(lo, u.ly + 220 * dt);
  else if (u.ly > hi) u.ly = Math.max(hi, u.ly - 220 * dt);
}

function updateUnit(u, dt) {
  if (u.dead) { u.deadT += dt; return; }
  u.t += dt; u.cd -= dt; u.dodgeCd -= dt; u.specCd -= dt; u.iT -= dt; u.flash -= dt;
  if (u.slowT > 0) u.slowT -= dt;
  if (u.armorT > 0) u.armorT -= dt;
  if (u.life !== undefined) { u.life -= dt; if (u.life <= 0 && !G.over) { u.dead = true; u.state = 'dead'; u.deadT = 0; for (let i = 0; i < 10; i++) spark(u.x, GY + u.ly - 40, '#c070ff'); return; } }
  u.comboT -= dt; if (u.comboT <= 0) u.combo = 0;
  if (u.state === 'block') u.blockT += dt;
  if (u.state === 'hurt') {
    u.stun -= dt;
    u.x += u.kb * dt; u.kb *= Math.pow(0.02, dt);
    if (u.stun <= 0) { u.state = 'idle'; u.t = 0; }
    clampX(u); applyTerrain(u, dt); return;
  }
  if (u.state === 'attack') {
    const th = (u.special && SP_T[u.special]) || [0.5];
    while (u.hitIdx < th.length && u.t >= u.atkT * th[u.hitIdx]) {
      const i = u.hitIdx++;
      if (u.special) specialHit(u, i); else strike(u);
    }
    if (!u.special && u.t < u.atkT * 0.6) u.x += u.face * 26 * dt;
    if (u.special === 'spear' && u.t < u.atkT * 0.5) u.x += u.face * 120 * dt;
    if (u.t >= u.atkT) { u.state = 'idle'; u.t = 0; u.cd = 0.18; u.special = null; }
    clampX(u); applyTerrain(u, dt); return;
  }
  if (u.state === 'dash') {
    u.x += u.face * (u.dashSpd || 520) * dt;
    if (u.dashMult) {
      for (const e of enemiesOf(u)) {
        if (u.dashSet.has(e) || Math.abs(e.x - u.x) > 46 || Math.abs(e.ly - u.ly) > LANE_HIT + 6) continue;
        u.dashSet.add(e);
        if (hit(u, e, dmgOf(u) * u.dashMult, u.face * 200, u.x - u.face * 20, true) && u.ctrl) gainXP(u, 6);
      }
    }
    if (u.t >= (u.dashDur || 0.26)) {
      if (u.afterSlash) { G.fx.push({ x: u.x + u.face * 30, y: GY + u.ly - 44, face: u.face, t: 0, life: 0.16, big: true, tier: spriteTier(u), sc: 1.2 }); hitCastleWith(u, dmgOf(u) * 2.2, 40); u.afterSlash = false; }
      u.state = 'idle'; u.t = 0; u.dashMult = 0; u.dashSpd = 0; u.dashDur = 0.26;
    }
    clampX(u); applyTerrain(u, dt); return;
  }
  if (G.over) { if (u.state !== 'idle') { u.state = 'idle'; } return; }
  if (u.ctrl) ctrlUpdate(u, dt); else aiUpdate(u, dt);
  clampX(u); applyTerrain(u, dt);
}
function clampX(u) {
  u.x = clamp(u.x, 80, WW - 80);
  if (u.team === 0) u.x = Math.min(u.x, G.castle[1].x - CASTLE_HALF);
  else u.x = Math.max(u.x, G.castle[0].x + CASTLE_HALF);
  u.ly = clamp(u.ly, laneMin(), laneMax());
}

function trySpecial(u, mx) {
  const sp = SPECIALS[u.type];
  if (!sp) return;
  if (mx) u.face = mx;
  else { const e = nearestEnemy(u, 400); if (e) u.face = e.x >= u.x ? 1 : -1; }
  u.specCd = sp.cd;
  floatText(u.x, GY + u.ly - 130, sp.name, '#ffd86b', 1.0);
  switch (u.type) {
    case 'samurai': startDash(u, 1000, 0.17, 2.2, true); u.afterSlash = true; sfx(900, 0.15, 'sawtooth', 0.06, -600); break;
    case 'ashigaru': startAttack(u, 'spear', 0.5); break;
    case 'archer': startAttack(u, 'fan', 0.6); break;
    case 'sohei': startAttack(u, 'whirl', 0.6); break;
    case 'ronin': startAttack(u, 'dance', 0.9); u.iT = 0.95; break;
    case 'heavy': startAttack(u, 'quake', 0.8); break;
    case 'general': startAttack(u, 'decree', 0.6); break;
  }
}

function ctrlUpdate(u, dt) {
  const b = UNITS[u.type];
  const canAct = u.state === 'idle' || u.state === 'walk' || u.state === 'block';
  const mx = lookHeld ? 0 : (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  const my = lookHeld ? 0 : (inp.down ? 1 : 0) - (inp.up ? 1 : 0);
  if ((mx || my || inp.atk || inp.block) && G.look > 0 && !G.dragging && !lookHeld) { G.look = 0; G.peeking = false; }
  if (u.state === 'block' && !inp.block) { u.state = 'idle'; u.t = 0; }
  if (inp.specialP) {
    inp.specialP = false;
    if (canAct && u.specCd <= 0 && u.state !== 'block') { trySpecial(u, mx); return; }
  }
  if (inp.dodgeP) {
    inp.dodgeP = false;
    if (canAct && u.dodgeCd <= 0) {
      u.state = 'dash'; u.t = 0; u.iT = 0.3; u.dodgeCd = 0.8; u.dashSpd = 520; u.dashDur = 0.26; u.dashMult = 0;
      if (mx) u.face = mx;
      sfx(200, 0.12, 'triangle', 0.04, 200);
      return;
    }
  }
  if (inp.block && (u.state === 'idle' || u.state === 'walk')) { u.state = 'block'; u.blockT = 0; u.t = 0; }
  else if (inp.atk && u.cd <= 0 && (u.state === 'idle' || u.state === 'walk')) {
    if (mx) u.face = mx;
    else {
      const e = nearestEnemy(u, b.ranged ? 360 : rangeOf(u) + 90);
      if (e) u.face = e.x >= u.x ? 1 : -1;
    }
    startAttack(u); return;
  }
  if (canAct) {
    const sp = spdOf(u) * (u.state === 'block' ? 0.35 : 1);
    if (mx) { u.face = mx; u.x += mx * sp * dt; }
    if (my) u.ly += my * sp * 0.7 * dt;
    if (u.state !== 'block') {
      const ns = (mx || my) ? 'walk' : 'idle';
      if (ns !== u.state) { u.state = ns; u.t = 0; }
    }
  }
}

function summonGuards(u, n) {
  for (let i = 0; i < n; i++) {
    const g = mk(i % 2 ? 'samurai' : 'heavy', 1, u.x - 70 - i * 28, G.stage.lvl);
    g.summoned = true;
    G.units.push(g);
    for (let k = 0; k < 8; k++) spark(g.x, GY + g.ly - 30, '#c070ff');
  }
  banner('The Emperor summons his guard!');
  sfx(140, 0.5, 'sawtooth', 0.06, 100);
}
function startSlam(u) {
  u.state = 'attack'; u.t = 0; u.hitIdx = 99; u.special = null; u.atkT = 0.9;
  G.zones.push({ kind: 'slam', x: u.x + u.face * 80, ly: u.ly, r: 210, t: 0, life: 0.9, owner: u, lw: 70, done: false });
  sfx(110, 0.5, 'sawtooth', 0.05, -40);
}

function runAbility(u, tg) {
  const nm = G.stage.gen;
  const ab = G.stage.ability;
  switch (ab) {
    case 'charge':
      u.face = tg.x >= u.x ? 1 : -1; startDash(u, 640, 0.6, 1.4, false); banner(nm + ': CHARGE!'); sfx(160, 0.5, 'sawtooth', 0.06, 100); break;
    case 'archers':
      summonUnits(1, 'archer', 2, u.x - 60, 0); banner(nm + ' calls his archers!'); break;
    case 'rockfall': {
      const targets = G.units.filter(e => e.team === 0 && !e.dead).sort((a, b) => Math.abs(a.x - u.x) - Math.abs(b.x - u.x)).slice(0, 3);
      for (const e of targets) G.zones.push({ kind: 'rock', x: e.x + rand(-30, 30), ly: e.ly, r: 78, t: 0, life: 1.0, owner: u, lw: 45, done: false });
      banner(nm + ' triggers a rockslide!'); sfx(90, 0.5, 'sawtooth', 0.05, -30); break;
    }
    case 'blink': {
      for (let i = 0; i < 10; i++) spark(u.x, GY + u.ly - 40, '#9ad0ff');
      u.x = tg.x + (u.x < tg.x ? 70 : -70); u.ly = tg.ly; u.face = tg.x >= u.x ? 1 : -1;
      for (let i = 0; i < 10; i++) spark(u.x, GY + u.ly - 40, '#9ad0ff');
      banner(nm + ' vanishes in the mist!'); startAttack(u); sfx(900, 0.2, 'sine', 0.06, -500); break;
    }
    case 'fire':
      for (let i = 0; i < 4; i++) G.zones.push({ kind: 'fire', x: u.x + u.face * (90 + i * 110), ly: u.ly + rand(-15, 15), r: 70, t: 0, life: 6, hurt: 0, tick: 0.5, owner: u, lw: 40 });
      banner(nm + ' sets the ground ablaze!'); break;
    case 'wall':
      summonUnits(1, 'heavy', 2, u.x - 60, 0); u.armorT = 5; floatText(u.x, GY + u.ly - 140, 'IRON WALL', '#cde', 1.4); banner(nm + ': Iron Wall!'); break;
    case 'frost':
      G.zones.push({ kind: 'frost', x: u.x, ly: u.ly, r: 210, t: 0, life: 0.9, owner: u, lw: 80, done: false });
      banner(nm + ' gathers a killing frost!'); break;
    case 'clones':
      summonUnits(1, 'ronin', 3, u.x - 50, 12); banner(nm + ' summons shadow clones!'); break;
    case 'warcry':
      for (const a of alliesOf(1)) { a.buffT = 6; a.hp = Math.min(a.maxhp, a.hp + a.maxhp * 0.15); for (let k = 0; k < 4; k++) spark(a.x, GY + a.ly - 50, '#ff8a70'); }
      banner(nm + ' roars: the enemy army surges!'); G.shake = 5; sfx(150, 0.4, 'sawtooth', 0.06, 80); break;
  }
}

function aiUpdate(u, dt) {
  const b = UNITS[u.type];
  const home = isGen(u);
  const sp = spdOf(u);
  const ec = G.castle[1 - u.team];
  const goto = (tx, speed) => {
    const d = tx - u.x;
    if (Math.abs(d) < 6) { setIdle(u); return; }
    u.face = d > 0 ? 1 : -1; u.x += u.face * speed * dt;
    if (u.state !== 'walk') { u.state = 'walk'; u.t = 0; }
  };
  const engageT = tg => {
    const dist = Math.abs(tg.x - u.x);
    const reach = b.ranged ? b.range * 0.92 : rangeOf(u);
    const dy = tg.ly - u.ly;
    if (Math.abs(dy) > 14) u.ly += Math.sign(dy) * Math.min(Math.abs(dy), sp * 0.6 * dt);
    if (dist <= reach) {
      u.face = tg.x >= u.x ? 1 : -1;
      if (Math.abs(dy) <= 20) { if (u.cd <= 0) startAttack(u); else setIdle(u); }
      else if (u.state !== 'walk') { u.state = 'walk'; u.t = 0; }
    } else goto(tg.x, sp);
  };
  const tg0 = nearestEnemy(u, 1e9);
  const dist0 = tg0 ? Math.abs(tg0.x - u.x) : 1e9;
  if (u.type === 'emperor' && !G.over) {
    u.summonT -= dt; u.slamT -= dt;
    const ph2 = u.hp < u.maxhp * 0.5;
    if (ph2 && !u.enraged) { u.enraged = true; banner('THE EMPEROR IS ENRAGED!'); G.shake = 10; sfx(90, 0.6, 'sawtooth', 0.08, 40); }
    if (u.summonT <= 0) { summonGuards(u, ph2 ? 4 : 3); u.summonT = ph2 ? 9 : 14; }
    if (u.slamT <= 0 && tg0 && dist0 < 280 && Math.abs(tg0.ly - u.ly) < 60) { startSlam(u); u.slamT = ph2 ? 6 : 9; return; }
  } else if (u.type === 'general' && u.team === 1 && !G.over && G.stage.ability) {
    u.abT -= dt;
    if (u.abT <= 0 && tg0 && dist0 < 520) { runAbility(u, tg0); u.abT = rand(12, 16); if (u.state === 'attack' || u.state === 'dash') return; }
  }
  if (home) {
    const hurt = u.hp < u.maxhp;
    const aggro = hurt ? 420 : 240, leash = hurt ? 620 : 380;
    if (tg0 && dist0 < aggro && Math.abs(tg0.x - u.homeX) < leash) engageT(tg0);
    else if (Math.abs(u.x - u.homeX) > 10) goto(u.homeX, sp);
    else { setIdle(u); u.face = u.team ? -1 : 1; }
    return;
  }
  // player army orders
  if (u.team === 0 && G.order.mode !== 'attack') {
    const o = G.order;
    const lead = o.mode === 'follow' ? (G.ctrl && !G.ctrl.dead ? G.ctrl : G.gen[0]) : null;
    const ax = o.mode === 'hold' ? o.x : lead.x;
    const leash = o.mode === 'hold' ? 380 : 320;
    let best = null, bd = 1e9;
    for (const e of G.units) {
      if (e.dead || e.team === 0) continue;
      if (Math.abs(e.x - ax) < leash) { const d = Math.abs(e.x - u.x); if (d < bd) { bd = d; best = e; } }
    }
    if (best) engageT(best);
    else goto(ax + ((u.id % 9) - 4) * 16, sp);
    return;
  }
  const tg = nearestEnemy(u, 430);
  if (tg) engageT(tg);
  else if (!ec.dead) {
    const ed = castleEdge(ec, u);
    const reach = b.ranged ? b.range * 0.92 : rangeOf(u);
    if (ed <= reach) {
      u.face = ec.x > u.x ? 1 : -1;
      if (u.cd <= 0) startAttack(u); else setIdle(u);
    } else goto(ec.x, sp);
  }
}
function setIdle(u) { if (u.state !== 'idle') { u.state = 'idle'; u.t = 0; } }

// enemy spawn AI
function enemyWeights() {
  const i = G.stageIdx;
  const w = {
    ashigaru: Math.max(1, 4 - 0.3 * i), samurai: 3, archer: 2 + 0.1 * i,
    sohei: 1 + 0.15 * i, ronin: 1 + 0.2 * i, heavy: 0.4 + 0.25 * i + (G.stage.boss ? 1.2 : 0),
  };
  for (const k in UNLOCK) if (i < UNLOCK[k]) w[k] = 0;
  const mine = alliesOf(0);
  const arch = mine.filter(u => u.type === 'archer').length;
  const heavy = mine.filter(u => u.type === 'heavy').length;
  if (arch > 3 && w.ronin > 0) w.ronin += 2;
  if (heavy > 1) w.archer += 1.5;
  if (G.diffKey === 'hard' && w.heavy > 0) w.heavy += 0.8;
  return w;
}
function enemySpawnAI(dt) {
  G.spawnT -= dt;
  if (G.spawnT > 0) return;
  if (!G.want) {
    const w = enemyWeights();
    let tot = 0; for (const k in w) tot += w[k];
    let r = Math.random() * tot, pick = 'ashigaru';
    for (const k in w) { r -= w[k]; if (r <= 0) { pick = k; break; } }
    G.want = pick; G.wantT = 0;
  }
  G.wantT += dt;
  const b = UNITS[G.want];
  if (G.koku[1] >= b.cost && pop(1) < MAX_POP) {
    spawn(1, G.want);
    G.want = null;
    G.spawnT = rand(0.5, 1.6) * (G.diffKey === 'easy' ? 1.4 : G.diffKey === 'hard' ? 0.7 : 1);
  } else if (G.wantT > 5) {
    G.want = 'ashigaru';
  }
}

// ------------------------------------------------------------------ player actions
function buyRice() {
  if (G.rice >= RICE_COSTS.length || G.over) return;
  const c = RICE_COSTS[G.rice];
  if (G.koku[0] < c) return;
  G.koku[0] -= c; G.rice++;

}
function warCry() {
  if (G.over || G.warCd > 0 || G.koku[0] < WAR_COST) return;
  G.koku[0] -= WAR_COST; G.warCd = WAR_CD; G.buff = 6;

}

// ------------------------------------------------------------------ tutorial hints (battle 1)

  { when: g => pop(0) > 0, text: 'Take control of a soldier: click him, or press E. Press G to return to your Shogun.', dur: 9, until: g => g.ctrl && !isGen(g.ctrl) },
  { when: g => g.ctrl && !isGen(g.ctrl), text: 'A/D/W/S move · J attack · K block (just before a hit = PARRY) · L dodge · I special', dur: 10 },
  { when: g => g.t > 25, text: 'Swipe or drag the field to look around. Tap the minimap to jump. T peeks at the enemy castle.', dur: 9 },

];
function updateHints(dt) {
  if (G.stageIdx !== 0 || save.cleared > 0) return;
  const h = HINTS[G.hintIdx];
  if (!h) { G.hint = null; return; }
  if (!G.hint) { if (h.when(G)) { G.hint = { text: h.text, t: 0 }; } return; }

  if (G.hint.t > h.dur || (h.until && h.until(G) && G.hint.t > 2)) { G.hint = null; G.hintIdx++; }
}

// ------------------------------------------------------------------ drawing
function frameOf(u) {
  switch (u.state) {
    case 'idle': return Math.floor(u.t / 0.45) % 2;
    case 'walk': return 2 + Math.floor(u.t * 9) % 4;
    case 'attack':
      if (u.special === 'dance') return 6 + Math.floor(u.t / 0.11) % 4;
      return 6 + Math.min(3, Math.floor(u.t / u.atkT * 4));
    case 'hurt': return 10;
    case 'block': return 11;
    case 'dash': return 15;
    case 'dead': return 12 + Math.min(2, Math.floor(u.deadT / 0.18));
  }
  return 0;
}

function drawUnit(u, cam) {
  const key = u.type + '_' + (u.team ? 'b' : 'a') + spriteTier(u);
  const sheet = imgs[key];
  if (!sheet) return;
  const us = unitScale(u);
  const x = u.x - cam, fy = GY + u.ly;
  if (x < -200 || x > VW + 200) return;
  const alpha = (u.dead ? Math.max(0, 1 - Math.max(0, u.deadT - 1.6) / 1.0) : 1) * (u.clone ? 0.72 : 1);
  const tier = spriteTier(u);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(x, fy + 2, 24 * us, 7 * us, 0, 0, 7); ctx.fill();
  if (!u.dead) {
    ctx.strokeStyle = u.type === 'emperor' ? '#b060ff' : (tier >= 1 ? TIER_COL[tier] : (u.lvl >= 1 ? '#ffd86b' : (u.team ? '#3d8bff' : '#ff4a3a')));
    ctx.lineWidth = u.lvl >= 3 || u.type === 'emperor' ? 3 : 2;
    ctx.globalAlpha = alpha * (u.lvl >= 3 ? 0.95 : 0.7);
    ctx.beginPath(); ctx.ellipse(x, fy + 2, 24 * us, 7 * us, 0, 0, 7); ctx.stroke();
    ctx.globalAlpha = alpha;
    if (u.lvl >= 3 && u.team === 0) {
      const g = ctx.createRadialGradient(x, fy - 40, 6, x, fy - 40, 70);
      const gc = tier >= 1 ? TIER_COL[tier] : '#ffd86b';
      ctx.globalAlpha = alpha * 0.28; g.addColorStop(0, gc); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(x - 70, fy - 110, 140, 130);
      ctx.globalAlpha = alpha;
    }
  }
  ctx.translate(x, fy);
  if (u.face < 0) ctx.scale(-1, 1);
  const fr = frameOf(u);
  const sc = S * us;
  ctx.drawImage(sheet, fr * FW, 0, FW, FH, -CXF * sc, -31 * sc, FW * sc, FH * sc);
  if (u.flash > 0 && flashImgs[key]) {
    ctx.globalAlpha = 0.75 * alpha;
    ctx.drawImage(flashImgs[key], fr * FW, 0, FW, FH, -CXF * sc, -31 * sc, FW * sc, FH * sc);
  }
  if ((u.buffT > 0 || u.armorT > 0) && !u.dead) {
    ctx.globalAlpha = 0.25 + 0.15 * Math.sin(G.t * 12);
    ctx.drawImage(flashImgs[key], fr * FW, 0, FW, FH, -CXF * sc, -31 * sc, FW * sc, FH * sc);
  }
  if (u.slowT > 0 && !u.dead) {
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = '#9fe0ff';
    ctx.drawImage(flashImgs[key], fr * FW, 0, FW, FH, -CXF * sc, -31 * sc, FW * sc, FH * sc);
  }
  ctx.restore();
  if (u.dead) return;
  const topY = fy - 98 * us;
  if (u.hp < u.maxhp || u.ctrl) {
    const w = isGen(u) ? 56 * us : 38;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - w / 2, topY, w, 5);
    ctx.fillStyle = u.team ? '#4a8cff' : '#e8463a';
    ctx.fillRect(x - w / 2, topY, w * Math.max(0, u.hp / u.maxhp), 5);
  }
  if (u.lvl > 0 && u.team === 0) {
    ctx.fillStyle = tier >= 1 ? TIER_COL[tier] : '#ffd86b'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.7)';
    ctx.strokeText('Lv' + u.lvl, x, topY - 4); ctx.fillText('Lv' + u.lvl, x, topY - 4);
  }
  if (u.ctrl) {
    const by = topY - 18 + Math.sin(G.t * 6) * 3;
    ctx.fillStyle = '#ffe066'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - 9, by - 10); ctx.lineTo(x + 9, by - 10); ctx.lineTo(x, by + 2); ctx.closePath();
    ctx.stroke(); ctx.fill();
  }
}

function drawCastle(c, cam) {
  const sx = c.x - cam;
  if (sx < -300 || sx > VW + 300) return;
  const col = c.team ? (G.stage.boss ? '#a040e0' : '#2f78e0') : '#d8352a';
  const frac = c.hp / c.max;
  ctx.save();
  ctx.translate(sx, GY - 26);
  if (c.dead) {
    const k = Math.min(1, c.deadT / 1.2);
    ctx.fillStyle = '#4a4650';
    for (let i = 0; i < 9; i++) {
      const rx = -105 + i * 26 + (i % 2) * 6, rh = 14 + ((i * 37) % 22) * (1 - k * 0.2);
      ctx.beginPath(); ctx.moveTo(rx, 0); ctx.lineTo(rx + 12, -rh); ctx.lineTo(rx + 26, -rh * 0.5); ctx.lineTo(rx + 28, 0); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#2a2630'; ctx.fillRect(-90, -8, 180, 8);
    for (let i = 0; i < 6; i++) {
      const t = (G.t * 0.8 + i * 0.37) % 1;
      ctx.globalAlpha = (1 - t) * 0.5; ctx.fillStyle = i % 2 ? '#5a5560' : '#ff9a3a';
      ctx.beginPath(); ctx.arc(-70 + i * 28 + Math.sin(G.t + i) * 6, -20 - t * 90, 8 + t * 14, 0, 7); ctx.fill();
    }

    ctx.restore(); return;
  }
  // stone base
  ctx.fillStyle = '#6e6a72'; ctx.fillRect(-110, -64, 220, 64);
  ctx.fillStyle = '#58545e';
  for (let r = 0; r < 4; r++) for (let i = -110 + (r % 2) * 14; i < 110; i += 28) ctx.fillRect(i, -62 + r * 16, 26, 2);
  ctx.fillStyle = '#7e7a84'; for (let i = -110; i < 110; i += 22) ctx.fillRect(i, -72, 14, 8);
  // gate
  ctx.fillStyle = '#1b1216'; ctx.fillRect(-24, -44, 48, 44);
  ctx.beginPath(); ctx.arc(0, -44, 24, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#6b4a34'; ctx.fillRect(-26, -50, 52, 5);
  // towers
  for (const tx of [-86, 86]) {
    ctx.fillStyle = '#7a7680'; ctx.fillRect(tx - 22, -112, 44, 112);
    ctx.fillStyle = '#5c5864'; ctx.fillRect(tx - 22, -112, 6, 112);
    ctx.fillStyle = '#1a1420'; ctx.fillRect(tx - 4, -90, 8, 16);
    ctx.fillStyle = '#2a2230';
    ctx.beginPath(); ctx.moveTo(tx - 32, -112); ctx.lineTo(tx, -142); ctx.lineTo(tx + 32, -112); ctx.lineTo(tx + 24, -118); ctx.lineTo(tx - 24, -118); ctx.closePath(); ctx.fill();
    ctx.fillStyle = col; ctx.fillRect(tx - 26, -116, 52, 4);
  }
  // central keep (3 tiers)
  const tiers = [[-62, -100, 62, '#e8e4dc'], [-110, -140, 44, '#e2ded6'], [-148, -172, 28, '#ddd8d0']];
  tiers.forEach(([y0, y1, hw, cc], i) => {
    ctx.fillStyle = cc; ctx.fillRect(-hw, y1, hw * 2, y0 - y1);
    ctx.fillStyle = '#3a3040'; for (let k = -hw + 8; k < hw - 6; k += 18) ctx.fillRect(k, y1 + 8, 6, 10);
    const rw = hw + 22;
    ctx.fillStyle = '#2a2230';
    ctx.beginPath(); ctx.moveTo(-rw - 6, y1 + 2); ctx.lineTo(-rw + 8, y1 - 10); ctx.lineTo(rw - 8, y1 - 10); ctx.lineTo(rw + 6, y1 + 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = col; ctx.fillRect(-rw + 4, y1 - 3, rw * 2 - 8, 3);
  });
  ctx.fillStyle = '#e8c050'; ctx.beginPath(); ctx.moveTo(0, -196); ctx.lineTo(-6, -182); ctx.lineTo(6, -182); ctx.closePath(); ctx.fill();
  if (c.team === 1 && G.stage.boss) { ctx.fillStyle = '#e8c050'; ctx.fillRect(-112, -76, 224, 4); }
  // flags
  for (const fx of [-100, 100]) {
    ctx.fillStyle = '#6b4a34'; ctx.fillRect(fx - 1, -178, 3, 40);
    ctx.fillStyle = col; const w = Math.sin(G.t * 3 + fx) * 3;
    ctx.beginPath(); ctx.moveTo(fx + 2, -176); ctx.lineTo(fx + 30 + w, -168); ctx.lineTo(fx + 2, -152); ctx.closePath(); ctx.fill();
  }
  // damage
  if (frac < 0.7) { ctx.strokeStyle = 'rgba(20,16,24,.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-70, -64); ctx.lineTo(-62, -40); ctx.lineTo(-76, -20); ctx.moveTo(50, -64); ctx.lineTo(60, -44); ctx.lineTo(46, -24); ctx.stroke(); }
  if (frac < 0.4) {
    ctx.beginPath(); ctx.moveTo(-14, -100); ctx.lineTo(-6, -80); ctx.lineTo(-18, -66); ctx.moveTo(86, -112); ctx.lineTo(80, -90); ctx.stroke();
    for (const fx of [-86, 20, 86]) {
      for (let k = 0; k < 3; k++) {
        const t = (G.t * 1.6 + k * 0.33 + fx) % 1;
        ctx.globalAlpha = 1 - t; ctx.fillStyle = k % 2 ? '#ffb040' : '#ff5a20';
        ctx.beginPath(); ctx.arc(fx + Math.sin(t * 6 + k) * 6, -100 - t * 40, 7 - t * 4, 0, 7); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
  if (c.flash > 0) { ctx.globalAlpha = 0.28; ctx.fillStyle = '#fff'; ctx.fillRect(-110, -64, 220, 64); ctx.globalAlpha = 1; }
  // hp bar
  ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(-80, -216, 160, 9);
  ctx.fillStyle = c.team ? '#4a8cff' : '#e8463a'; ctx.fillRect(-79, -215, 158 * Math.max(0, frac), 7);
  ctx.restore();
}

function drawOutpost(o, cam) {
  const sx = o.x - cam;
  if (sx < -200 || sx > VW + 200) return;
  const col = o.owner === 0 ? '#d8352a' : o.owner === 1 ? '#2f78e0' : '#9a9a9a';
  ctx.save();
  ctx.fillStyle = o.prog > 0 ? 'rgba(216,53,42,.12)' : o.prog < 0 ? 'rgba(47,120,224,.12)' : 'rgba(200,200,200,.08)';
  ctx.beginPath(); ctx.ellipse(sx, GY + 6, 170, 38, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(sx, GY + 6, 170, 38, 0, 0, 7); ctx.stroke();
  if (o.prog !== 0) { ctx.strokeStyle = o.prog > 0 ? '#ff6a5a' : '#6aa0ff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(sx, GY + 6, 170, 38, 0, -Math.PI / 2, -Math.PI / 2 + Math.abs(o.prog) * Math.PI * 2); ctx.stroke(); }
  ctx.fillStyle = '#6b4a34'; ctx.fillRect(sx - 2, GY - 118, 4, 124);
  ctx.fillStyle = col; const w = Math.sin(G.t * 3 + o.x) * 4;
  ctx.beginPath(); ctx.moveTo(sx + 2, GY - 116); ctx.lineTo(sx + 44 + w, GY - 104); ctx.lineTo(sx + 2, GY - 84); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}

function drawZone(z, cam) {
  const x = z.x - cam, y = GY + z.ly + 2;
  if (x < -300 || x > VW + 300) return;
  if (z.kind === 'fire') {
    const tel = z.t < 1.0;
    ctx.fillStyle = tel ? 'rgba(255,140,40,.12)' : 'rgba(255,90,20,.28)';
    ctx.beginPath(); ctx.ellipse(x, y, z.r, z.r * 0.3, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = tel ? 'rgba(255,200,100,.6)' : 'rgba(255,120,40,.8)'; ctx.lineWidth = 2;
    if (tel) ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.ellipse(x, y, z.r, z.r * 0.3, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    if (!tel) {
      for (let i = 0; i < 7; i++) {
        const t = (G.t * 1.7 + i * 0.31) % 1, fx = x + (i - 3) * z.r * 0.28 + Math.sin(G.t * 3 + i) * 4;
        ctx.globalAlpha = 1 - t * 0.7; ctx.fillStyle = i % 2 ? '#ffd040' : '#ff5a20';
        ctx.beginPath(); ctx.moveTo(fx - 8, y); ctx.lineTo(fx, y - 28 - t * 24); ctx.lineTo(fx + 8, y); ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    return;
  }
  const k = z.t / z.life;
  const rgb = z.kind === 'frost' ? '110,200,255' : z.kind === 'rock' ? '255,170,60' : '255,40,50';
  ctx.fillStyle = `rgba(${rgb},${0.12 + 0.3 * k})`;
  ctx.beginPath(); ctx.ellipse(x, y, z.r, z.r * 0.28, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = `rgba(${rgb},${0.5 + 0.5 * k})`; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(x, y, z.r * k, z.r * 0.28 * k, 0, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x, y, z.r, z.r * 0.28, 0, 0, 7); ctx.stroke();
}

function drawWorld() {
  const cam = G.cam;
  let ox = 0, oy = 0;
  if (G.shake > 0) { ox = rand(-G.shake, G.shake); oy = rand(-G.shake, G.shake); }
  ctx.save();
  if (G.zoom > 1.001) {
    const fx = G.focusX - cam;
    ctx.translate(fx, GY - 60); ctx.scale(G.zoom, G.zoom); ctx.translate(-fx, -(GY - 60));
  }
  ctx.translate(ox, oy);
  ctx.drawImage(sky, 0, 0);
  for (const l of layers) ctx.drawImage(l.c, -cam * l.f, 0);
  const [at, ac] = theme.amb;
  ctx.fillStyle = ac;
  for (const p of petals) {
    let x, y;
    if (at === 'snow') { x = ((p.x - cam * 0.6 + Math.sin(G.t + p.ph) * 14) % VW + VW) % VW; y = (p.y + G.t * p.v * 2.2) % VH; }
    else if (at === 'ember') { x = ((p.x - cam * 0.6 + Math.sin(G.t * 2 + p.ph) * 12) % VW + VW) % VW; y = ((p.y - G.t * p.v * 1.5) % VH + VH) % VH; }
    else if (at === 'firefly') { x = ((p.x - cam * 0.6 + Math.sin(G.t * .7 + p.ph) * 40) % VW + VW) % VW; y = 260 + (p.y % 190) + Math.sin(G.t + p.ph) * 12; ctx.globalAlpha = 0.5 + 0.5 * Math.sin(G.t * 3 + p.ph); }
    else if (at === 'dust') { x = ((p.x - cam * 0.8 + G.t * p.v) % VW + VW) % VW; y = 250 + (p.y % 220); }
    else { x = ((p.x - cam * 0.6 + Math.sin(G.t + p.ph) * 20) % VW + VW) % VW; y = (p.y + G.t * p.v) % VH; }
    ctx.fillRect(x, y, p.s + 1, p.s);
    ctx.globalAlpha = 1;
  }
  const gg = ctx.createLinearGradient(0, GY - 36, 0, VH);
  gg.addColorStop(0, theme.g[0]); gg.addColorStop(0.4, theme.g[1]); gg.addColorStop(1, theme.g[2]);
  ctx.fillStyle = gg; ctx.fillRect(0, GY - 36, VW, VH - GY + 36);
  ctx.fillStyle = theme.dirt; ctx.fillRect(0, GY - 16, VW, 56);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, GY - 36, VW, 3);
  for (const t of tufts) {
    const x = t.x - cam;
    if (x < -10 || x > VW + 10) continue;
    ctx.fillStyle = t.c; ctx.fillRect(x, t.y, 2, t.h); ctx.fillRect(x + 3, t.y + 1, 2, t.h - 1);
  }
  // river + bridge
  if (G.stage.river) {
    const mid = WW / 2 - cam, half = 175;
    if (mid > -half - 20 && mid < VW + half + 20) {
      const wg = ctx.createLinearGradient(0, GY - 36, 0, VH);
      wg.addColorStop(0, '#3a6a9a'); wg.addColorStop(1, '#1a3a5a');
      ctx.fillStyle = wg; ctx.fillRect(mid - half, GY - 36, half * 2, VH - GY + 36);
      ctx.strokeStyle = 'rgba(200,230,255,.35)'; ctx.lineWidth = 2;
      for (let i = 0; i < 18; i++) {
        const wx = mid - half + 10 + ((i * 53 + G.t * 22) % (half * 2 - 20)), wy = GY - 20 + ((i * 29) % 100);
        ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + 14, wy); ctx.stroke();
      }
      ctx.fillStyle = '#7a5a38'; ctx.fillRect(mid - half - 6, GY - 20, half * 2 + 12, 44);
      ctx.fillStyle = '#5a3e26'; for (let i = mid - half - 6; i < mid + half + 6; i += 14) ctx.fillRect(i, GY - 20, 2, 44);
      ctx.fillStyle = '#3a2816'; ctx.fillRect(mid - half - 6, GY - 22, half * 2 + 12, 3); ctx.fillRect(mid - half - 6, GY + 22, half * 2 + 12, 3);
    }
  }
  for (const o of G.outposts) drawOutpost(o, cam);
  drawCastle(G.castle[0], cam); drawCastle(G.castle[1], cam);
  for (const z of G.zones) drawZone(z, cam);
  if (G.order.mode === 'hold') {
    const fx = G.order.x - cam;
    ctx.fillStyle = '#4f7aa8'; ctx.fillRect(fx - 1, GY - 60, 3, 66);
    ctx.fillStyle = '#8fc0ff'; ctx.beginPath(); ctx.moveTo(fx + 2, GY - 60); ctx.lineTo(fx + 26, GY - 52); ctx.lineTo(fx + 2, GY - 42); ctx.closePath(); ctx.fill();
  }
  const list = G.units.slice().sort((a, b) => (a.dead === b.dead ? (a.ly - b.ly) : (a.dead ? -1 : 1)));
  for (const u of list) drawUnit(u, cam);
  ctx.lineWidth = 2;
  for (const a of G.arrows) {
    const x = a.x - cam, y = a.y;
    ctx.strokeStyle = a.tier >= 1 ? TIER_COL[a.tier] : '#e8d8b0';
    ctx.beginPath(); ctx.moveTo(x - Math.sign(a.vx) * 18, y); ctx.lineTo(x, y); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillRect(x - (a.vx > 0 ? 0 : 3), y - 1, 3, 3);
  }
  for (const f of G.fx) {
    const k = f.t / f.life, x = f.x - cam;
    if (f.ring) {
      ctx.strokeStyle = `rgba(${f.col || '255,220,160'},${1 - k})`; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.ellipse(x, f.y, f.ring * (0.4 + 0.6 * k), f.ring * 0.28 * (0.4 + 0.6 * k), 0, 0, 7); ctx.stroke();
      continue;
    }
    ctx.save(); ctx.translate(x, f.y); ctx.scale(f.face, 1);
    const col = f.tier >= 1 ? TIER_COL[f.tier] : '#ffffff';
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = col;
    ctx.lineWidth = (f.big ? 5 : 3) + (f.tier >= 2 ? 2 : 0);
    const sc = f.sc || 1;
    ctx.beginPath(); ctx.arc(-24 * sc, 0, (f.big ? 58 : 46) * sc, -1.1 + k * 0.6, 1.1 + k * 0.4); ctx.stroke();
    ctx.restore();
  }
  for (const p of G.parts) {
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.col; ctx.fillRect(p.x - cam, p.y, 3, 3);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const t of G.texts) {
    ctx.globalAlpha = Math.min(1, (t.life - t.t) / 0.3);
    ctx.font = 'bold 16px system-ui'; ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.fillStyle = t.col;
    ctx.strokeText(t.text, t.x - cam, t.y); ctx.fillText(t.text, t.x - cam, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // darkness (forest)
  if (G.stage.dark && G.state !== 'menu') {
    const f = G.ctrl || G.gen[0];
    const dx = f.x - cam, dy = GY + f.ly - 40;
    const dg = ctx.createRadialGradient(dx, dy, 120, dx, dy, 480);
    dg.addColorStop(0, 'rgba(0,0,12,0)'); dg.addColorStop(1, 'rgba(0,0,12,.7)');
    ctx.fillStyle = dg; ctx.fillRect(0, 0, VW, VH);
  }
}

function bar(x, y, w, h, p, col) {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, p)), h);
  ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
}
function txt(s, x, y, size, col, align = 'left') {
  ctx.font = `bold ${size}px system-ui`; ctx.textAlign = align; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.8)';
  ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);
}

function drawHUD() {

// ------------------------------------------------------------------ UI: cards
const cardEls = [];
function buildCards() {
  cardsEl.innerHTML = '';
  cardEls.length = 0;
  ORDER.forEach((t, i) => {
    const b = UNITS[t];
    const d = document.createElement('div'); d.className = 'card';
    d.innerHTML = `<span class="key">${i + 1}</span><canvas width="56" height="32"></canvas><span class="nm">${b.name}</span><span class="cost">${b.cost}</span><div class="cd"></div>`;
    const ic = d.querySelector('canvas').getContext('2d');
    ic.imageSmoothingEnabled = false;
    if (imgs[t + '_a0']) ic.drawImage(imgs[t + '_a0'], 0, 0, FW, FH, 0, 0, FW, FH);
    d.title = b.name + ': ' + b.desc;
    d.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); if (G && G.state === 'play') spawn(0, t); });
    cardsEl.appendChild(d);
    cardEls.push({ el: d, type: t });
  });
  const r = document.createElement('div'); r.className = 'card special';
  r.innerHTML = '<span class="key">U</span><div style="font-size:22px">🌾</div><span class="nm">Rice Paddies</span><span class="cost"></span><div class="cd"></div>';
  r.title = 'Upgrade income (+4 koku/s)';
  r.addEventListener('pointerdown', e => { e.preventDefault(); if (G && G.state === 'play') buyRice(); });
  cardsEl.appendChild(r); cardEls.push({ el: r, type: 'rice' });
  const w = document.createElement('div'); w.className = 'card special';
  w.innerHTML = '<span class="key">R</span><div style="font-size:22px">📯</div><span class="nm">War Cry</span><span class="cost">' + WAR_COST + '</span><div class="cd"></div>';
  w.title = 'Army +30% damage, +20% speed for 6s';
  w.addEventListener('pointerdown', e => { e.preventDefault(); if (G && G.state === 'play') warCry(); });
  cardsEl.appendChild(w); cardEls.push({ el: w, type: 'war' });
  [['attack', '⚔', '7', 'Advance: army marches on the enemy castle'], ['hold', '⚑', '8', 'Hold the line where you stand'], ['follow', '👣', '9', 'Follow me: army gathers around the unit you control']].forEach(([m, ico, k, tip]) => {
    const o = document.createElement('div'); o.className = 'card order'; o.dataset.mode = m;
    o.innerHTML = `<span class="key">${k}</span><div class="ico">${ico}</div><span class="nm">${m === 'attack' ? 'Advance' : m === 'hold' ? 'Hold' : 'Follow'}</span>`;
    o.title = tip;
    o.addEventListener('pointerdown', e => { e.preventDefault(); if (G && G.state === 'play') setOrder(m); });
    cardsEl.appendChild(o);
  });
}
function refreshOrderCards() {
  cardsEl.querySelectorAll('.order').forEach(o => o.classList.toggle('act', G && o.dataset.mode === G.order.mode));
}
function updateCards() {
  if (!G) return;
  for (const c of cardEls) {
    let ok = true, cdp = 0, lock = false;
    if (c.type === 'rice') {
      const maxed = G.rice >= RICE_COSTS.length;
      const cost = maxed ? 0 : RICE_COSTS[G.rice];
      c.el.querySelector('.cost').textContent = maxed ? 'MAX' : cost;
      ok = !maxed && G.koku[0] >= cost;
    } else if (c.type === 'war') {
      ok = G.koku[0] >= WAR_COST && G.warCd <= 0; cdp = Math.max(0, G.warCd / WAR_CD);
    } else {
      const b = UNITS[c.type];
      lock = !unlocked(c.type);
      ok = G.koku[0] >= b.cost && pop(0) < MAX_POP;
      cdp = Math.max(0, (G.cds[c.type] || 0) / (b.cd * (1 - 0.08 * upLvl('drill'))));
      if (cdp > 0) ok = false;
      c.el.querySelector('.cost').textContent = lock ? '🔒 B' + (UNLOCK[c.type] + 1) : b.cost;
    }
    c.el.classList.toggle('locked', lock);
    c.el.classList.toggle('off', !ok && !lock);
    c.el.querySelector('.cd').style.height = (cdp * 100) + '%';
  }
}

  });

      ${vetLine}${unlLine}

function endBattle() {
  G.state = 'over';
  const win = G.over === 'win';
  const prevCleared = save.cleared;
  for (const t in G.best) if (G.best[t] > (save.legacy[t] || 0)) save.legacy[t] = G.best[t];
  let honor = 0;
  if (win) {
    honor = 30 + 20 * G.stageIdx + G.kills;
    if (G.stageIdx < prevCleared) honor = Math.floor(honor * 0.5);
    save.cleared = Math.max(save.cleared, G.stageIdx + 1);
  } else honor = Math.floor(G.kills * 0.6);
  save.honor += honor;
  writeSave();
  const newly = Object.keys(UNLOCK).filter(k => prevCleared < UNLOCK[k] && save.cleared >= UNLOCK[k]).map(k => UNITS[k].name);
  const secs = Math.round(G.t);
  const last = G.stageIdx === STAGES.length - 1;
  const idx = G.stageIdx;
  const stats = `Time ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')} · Enemies defeated ${G.kills} · Soldiers lost ${G.lost} · Highest mastery Lv ${G.maxLvl}<br>Honor earned: <b style="color:#ffd86b">+${honor}</b>${newly.length ? '<br><b style="color:#7af7e6">Unlocked: ' + newly.join(', ') + '!</b>' : ''}`;
  if (win && last) {
    showOverlay(`
      <h1 style="color:#ffd86b">THE EMPEROR HAS FALLEN</h1>
      <p>Your clan rules all of Japan. The campaign is complete.</p>
      <p>${stats}</p>
      <div class="btns"><div class="btn" id="a">Back to map</div><div class="btn alt" id="b">Menu</div></div>`, 'end');
    document.getElementById('a').onclick = () => showMap(STAGES.length - 1);
    document.getElementById('b').onclick = showTitle;
    return;
  }
  showOverlay(`
    <h1 style="color:${win ? '#ffd86b' : '#ff7a6a'}">${win ? 'VICTORY' : 'DEFEAT'}</h1>
    <p>${win ? 'The enemy castle is rubble. The road ahead is open.' : 'Your castle has fallen.'}</p>
    <p>${stats}</p>
    <p class="vet">Your best veterans carry their experience into the next battle.</p>
    <div class="btns">
      ${win ? '<div class="btn" id="a">Next battle</div>' : '<div class="btn" id="a">Retry</div>'}
      <div class="btn alt" id="b">Map</div></div>`, 'end');
  document.getElementById('a').onclick = () => { if (win) showMap(Math.min(idx + 1, STAGES.length - 1)); else startStage(idx); };
  document.getElementById('b').onclick = () => showMap(Math.min(save.cleared, STAGES.length - 1));
}

function pauseGame() {
  if (!G || G.state !== 'play') return;
  G.state = 'pause';
  showOverlay(`<h2>Paused</h2><div class="btns"><div class="btn" id="a">Resume</div><div class="btn alt" id="h">How to play</div><div class="btn alt" id="s">Sound: ${muted ? 'OFF' : 'ON'}</div><div class="btn alt" id="b">Abandon battle</div></div>`, 'pause');

function resumeGame() { if (G && G.state === 'pause') { G.state = 'play'; hideOverlay(); } }

// ------------------------------------------------------------------ camera look
function beginLook() { if (G.look <= 0) G.camT = G.cam; }
function peek() {
  if (!G || G.state !== 'play' || G.over) return;
  if (G.peeking && G.look > 0) { G.look = 0; G.peeking = false; return; }
  beginLook(); G.camT = clamp(G.castle[1].x - VW / 2, 0, WW - VW); G.look = 4; G.peeking = true;
}
const MM = { x: VW / 2 - 180, w: 360 };
function minimapHit(px, py) { return py >= 20 && py <= 64 && px >= MM.x - 12 && px <= MM.x + MM.w + 12; }
function mapJump(px) {
  const f = clamp((px - MM.x) / MM.w, 0, 1);
  beginLook(); G.camT = clamp(f * WW - VW / 2, 0, WW - VW); G.look = 4; G.peeking = false;
}

// ------------------------------------------------------------------ input
const KEYMAP = {
  left: ['ArrowLeft', 'a', 'A'], right: ['ArrowRight', 'd', 'D'],
  up: ['ArrowUp', 'w', 'W'], down: ['ArrowDown', 's', 'S'],
  atk: ['j', 'J', ' ', 'z', 'Z'], block: ['k', 'K', 'x', 'X'],
};
const touchHeld = {};
function recompute() {
  const any = (arr, tk) => arr.some(k => keys[k]) || !!touchHeld[tk];
  inp.left = any(KEYMAP.left, 'left');
  inp.right = any(KEYMAP.right, 'right');
  inp.up = any(KEYMAP.up, 'up');
  inp.down = any(KEYMAP.down, 'down');
  inp.atk = any(KEYMAP.atk, 'atk');
  inp.block = any(KEYMAP.block, 'block');
}
window.addEventListener('keydown', e => {
  if (!G) return;

  if (k === 'l' || e.key === 'Shift' || k === 'c') inp.dodgeP = true;
  if (k === 'i' || k === 'v') inp.specialP = true;
  if (k === 'q') cycle(-1);
  if (k === 'e') cycle(1);
  if (k === 'g') fallbackCtrl(0);
  if (k === 't') peek();
  if (k === 'u') buyRice();
  if (k === 'r') warCry();

  if (e.key === '8') setOrder('hold');

window.addEventListener('keyup', e => { if (e.key === 'Tab') { lookHeld = false; return; } keys[e.key] = false; recompute(); });

touchEl.querySelectorAll('.tb').forEach(b => {
  const act = b.dataset.act;
  const down = e => {
    e.preventDefault(); initAudio();
    if (!G) return;
    if (act === 'pause') { if (G.state === 'play') pauseGame(); else if (G.state === 'pause') resumeGame(); return; }
    if (G.state !== 'play') return;
    if (act === 'dodge') { inp.dodgeP = true; return; }
    if (act === 'special') { inp.specialP = true; return; }
    if (act === 'prev') { cycle(-1); return; }
    if (act === 'next') { cycle(1); return; }
    if (act === 'gen') { fallbackCtrl(0); return; }
    if (act === 'peek') { peek(); return; }

let ptr = null;

  let best = null, bd = 44;
  for (const u of G.units) {
    if (u.dead || u.team !== 0) continue;
    const fy = GY + u.ly;

});

  if (!ptr || e.pointerId !== ptr.id || !G || G.state !== 'play') return;
  const [px, , sc] = canvasXY(e);
  if (ptr.mini) { mapJump(px); return; }
  const dx = e.clientX - ptr.lx;
  if (!ptr.moved && Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy) > 10) { ptr.moved = true; beginLook(); G.dragging = true; }
  if (ptr.moved) { G.camT = clamp(G.camT - dx * sc, 0, WW - VW); G.cam = G.camT; G.look = 99; G.peeking = false; }

});
function endPtr(e, cancel) {

  const p = ptr; ptr = null;
  if (!G) return;

cv.addEventListener('pointerup', e => endPtr(e, false));
cv.addEventListener('pointercancel', e => endPtr(e, true));

// ------------------------------------------------------------------ loop
let last = 0;
function frame(ts) {
  const raw = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts;
  if (G) {
    if (G.state === 'play') {
      if (G.hs > 0) G.hs -= raw;
      else {
        let dt = raw;
        if (G.over) dt *= 0.4; else if (G.slowT > 0) { G.slowT -= raw; dt *= 0.3; }
        update(dt);
      }
    }
    mus.mode = (G.state === 'play' || G.state === 'pause' || G.state === 'over') ? (G.stage.boss ? 'boss' : 'battle') : 'calm';
    if (G.state === 'over') mus.mode = 'calm';
    drawWorld(); if (G.state !== 'menu') drawHUD(); updateCards();
  }
  requestAnimationFrame(frame);
}

loadAll().then(() => {
  loadSave();
  buildCards();
  newGame(0);
  G.state = 'menu';
  showTitle();
  requestAnimationFrame(frame);
});

window.__SC = { get G() { return G; }, get save() { return save; }, UNITS, STAGES, spawn, setCtrl, cycle, update, startStage, showMap, showTitle, gainXP, tierOf, endBattle, mk, setOrder, peek, mapJump, beginLook, trySpecial, runAbility, damageCastle, die, summonUnits, inp, startFromTitle };
})();
